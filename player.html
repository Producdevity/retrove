<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>Retrove Player</title>
    <link rel="manifest" href="/app.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
  </head>
  <body>
    <header id="toolbar">
      <a href="/" id="back" class="glass control" aria-label="Return to library"
        ><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 8 12l7 7" /></svg
        ><span class="control-label">Library</span></a
      ><span id="title">Opening app</span
      ><span class="glass control-group"
        ><button id="fullscreen" class="control" aria-label="Full screen">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" />
          </svg></button
        ><button
          id="orientation"
          class="control"
          aria-label="Orientation"
          popovertarget="orientation-menu"
        >
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="8" y="3" width="8" height="14" rx="2" />
            <path d="M5 13a8 8 0 0 0 13 6M18 19h-3.5M18 19v-3.5" />
          </svg></button
        ><button id="diagnostics" class="control" aria-label="Report">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 4h9l3 3v13H6z" />
            <path d="M9 11h6M9 15h6" />
          </svg></button
      ></span>
    </header>
    <main id="stage">
      <div id="display"></div>
      <div id="loading">
        <canvas class="boot-tile" width="132" height="132" aria-hidden="true"></canvas>
        <h1 id="status" aria-live="polite">Opening app</h1>
        <p id="detail">Preparing the runtime</p>
        <div class="boot-steps" aria-hidden="true">
          <span></span><span></span><span></span><span></span>
        </div>
      </div>
    </main>
    <p id="tap-hint" class="glass" hidden>Tap to play</p>
    <button id="show-toolbar" class="glass control" aria-label="Show player controls" hidden>
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M5.5 12h.01M12 12h.01M18.5 12h.01" />
      </svg>
    </button>
    <div id="orientation-menu" class="orientation-menu" popover>
      <fieldset class="orientation-options">
        <legend>Orientation</legend>
        <label
          ><input type="radio" name="orientation" value="auto" /><svg
            class="icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v4h-4" /></svg
          >Auto</label
        >
        <label
          ><input type="radio" name="orientation" value="portrait" /><svg
            class="icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <rect x="7" y="3" width="10" height="18" rx="2.5" /></svg
          >Portrait</label
        >
        <label
          ><input type="radio" name="orientation" value="landscape" /><svg
            class="icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <rect x="3" y="7" width="18" height="10" rx="2.5" /></svg
          >Landscape</label
        >
      </fieldset>
      <p>Turns the game to fill the screen, even with rotation lock on.</p>
    </div>
    <dialog id="report-dialog" aria-labelledby="report-title">
      <header>
        <h2 id="report-title">Report</h2>
        <form method="dialog"><button class="button">Done</button></form>
      </header>
      <dl class="report-facts">
        <div>
          <dt>Now</dt>
          <dd id="report-phase">Starting</dd>
        </div>
        <div>
          <dt>Frame rate</dt>
          <dd id="report-fps">–</dd>
        </div>
        <div>
          <dt>Running</dt>
          <dd id="report-time">0 s</dd>
        </div>
      </dl>
      <p id="summary" class="report-note">
        No problems so far. If something looks wrong, share this report.
      </p>
      <div class="report-actions">
        <button id="share-log" class="button filled">Share report</button
        ><button id="copy-log" class="button">Copy</button>
      </div>
      <p id="copy-status" role="status"></p>
      <details class="report-raw">
        <summary>Full technical report</summary>
        <textarea id="log" readonly aria-label="Runtime report"></textarea>
      </details>
    </dialog>
    <script type="module" src="/src/player/main.ts"></script>
  </body>
</html>
