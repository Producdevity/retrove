<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Retrove Player</title>
    <link rel="manifest" href="/app.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
  </head>
  <body>
    <header id="toolbar">
      <a href="/" id="back" aria-label="Return to library">‹ Library</a
      ><span id="title">Opening app</span><button id="fullscreen">Full screen</button
      ><button id="diagnostics">Report</button>
    </header>
    <main id="stage">
      <div id="display"></div>
      <div id="loading">
        <span class="spinner"></span>
        <h1 id="status">Opening app</h1>
        <p id="detail">Preparing the runtime</p>
      </div>
    </main>
    <button id="resume-media" hidden>Enable playback</button>
    <button id="show-toolbar" aria-label="Show player controls" hidden>•••</button>
    <dialog id="report-dialog">
      <header>
        <h2>Runtime report</h2>
        <form method="dialog"><button>Done</button></form>
      </header>
      <p id="summary"></p>
      <button id="copy-log">Copy logs</button>
      <p id="copy-status" role="status"></p>
      <textarea id="log" readonly aria-label="Runtime report"></textarea
      ><button id="save-log">Save report</button>
    </dialog>
    <script type="module" src="/src/player/main.ts"></script>
  </body>
</html>
